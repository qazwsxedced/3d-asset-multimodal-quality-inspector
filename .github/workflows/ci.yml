name: Quality Inspector CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q demo blender src scripts tests

      - name: Run unit and regression-contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  deterministic-regression:
    name: Deterministic scoring regression
    runs-on: ubuntu-latest
    needs: unit-and-contract-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scoring and schema regression tests
        run: python -m unittest discover -s tests -p "test_quality_scoring.py" -v
